<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TrackForge Racing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#101820}
button{font:inherit;color:#fff;border:0;border-radius:14px;padding:14px 18px;background:#1d2a36;font-weight:800}
button:active{transform:scale(.97)}
#menu,#garage,#tracks,#settings,#weekend,#result,#draw{position:absolute;inset:0;display:none} #menu{display:block}
.panel{max-width:560px;margin:auto;padding:24px;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
h1{font-size:42px;margin:0 0 4px;font-style:italic;letter-spacing:-2px}
h2{margin:0 0 8px}.sub{opacity:.7;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
.card{background:#121b24;border:1px solid #263542;border-radius:18px;padding:16px}
.big{font-size:20px;padding:18px}
.accent{background:#e9283f}.green{background:#17a673}.disabled{opacity:.45}
.top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;z-index:5}
#hud{display:none}.hudbox{background:#071019d9;border:1px solid #344653;border-radius:12px;padding:8px 11px;font-weight:800}.small{font-size:12px;opacity:.75}
#controls{position:absolute;inset:0;display:none;pointer-events:none}
.ctrl{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44;display:flex;align-items:center;justify-content:center;font-size:25px;pointer-events:auto;user-select:none}
#left{left:18px}#right{left:108px}#brake{right:108px}#gas{right:18px;background:#16a67366}
#pause{display:none;position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:48px;height:48px;padding:0;border-radius:50%;z-index:8}
#drawUI{position:absolute;top:0;left:0;right:0;padding:14px;display:none;z-index:5;background:linear-gradient(#071019e8,transparent)}
#drawUI .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
#drawHint{opacity:.8;font-size:13px}
#phaseBanner{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;font-style:italic;text-shadow:0 5px 20px #000;display:none;z-index:6;text-align:center}
@media(max-width:420px){h1{font-size:35px}.panel{padding:18px}.ctrl{width:70px;height:70px}.grid{gap:8px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<section id="menu"><div class="panel">
<h1>TRACKFORGE<br>RACING</h1><div class="sub">Zeichne. Fahre. Kämpfe.</div>
<button class="big accent" onclick="startDraw()">✏️ STRECKE ZEICHNEN</button>
<button class="big" onclick="showGarage()">🚗 GARAGE</button>
<button class="big" onclick="showTracks()">🏆 MEINE STRECKEN</button>
<button class="big" onclick="startWeekend()">🏎️ FAHREN</button>
<button class="big" onclick="showSettings()">⚙️ EINSTELLUNGEN</button>
</div></section>

<section id="draw"><div id="drawUI"><div class="row"><b>✏️ STRECKE ZEICHNEN</b><button onclick="finishDraw()">FERTIG</button></div><div id="drawHint">Zeichne eine geschlossene Runde. Der Startpunkt wird Start/Ziel.</div></div></section>

<section id="garage"><div class="panel"><h2>🚗 GARAGE</h2><div id="cars" class="grid"></div><button onclick="home()">← ZURÜCK</button></div></section>
<section id="tracks"><div class="panel"><h2>🏆 MEINE STRECKEN</h2><div id="trackList"></div><button onclick="home()">← ZURÜCK</button></div></section>
<section id="settings"><div class="panel"><h2>⚙️ EINSTELLUNGEN</h2><div class="card"><b>Ideallinie</b><br><button id="lineBtn" onclick="toggleLine()">AKTIV</button></div><div class="card"><b>Schwierigkeit</b><div class="grid" style="margin-top:10px"><button onclick="difficulty=0">EASY</button><button onclick="difficulty=1">NORMAL</button><button onclick="difficulty=2">HARD</button></div></div><button onclick="home()">← ZURÜCK</button></div></section>

<section id="weekend"><div class="panel"><h2>🏁 RENNWOCHENENDE</h2><div id="weekendText" class="card"></div><div class="grid"><button onclick="beginSession('practice')">TRAINING</button><button onclick="beginSession('qualify')">QUALIFYING</button><button class="wide accent" onclick="beginSession('race')">RENNEN</button></div><button onclick="home()">← ZURÜCK</button></div></section>

<section id="result"><div class="panel"><h1 id="resultTitle">🏆 ZIEL!</h1><div id="resultText" class="card"></div><button class="accent" onclick="startWeekend()">NOCHMAL FAHREN</button><button onclick="home()">HAUPTMENÜ</button></div></section>

<div id="hud"><div class="top">
<div class="hudbox"><span id="pos">P1</span> · <span id="lap">Runde 1/5</span><br><span id="time">0:00.000</span> <span class="small">Beste: <span id="best">--</span></span></div>
<div class="hudbox" style="text-align:right"><span id="speed">0</span> km/h<br><span id="tyre">MEDIUM · 100%</span></div>
</div></div>
<button id="pause" onclick="pauseGame()">Ⅱ</button>
<div id="controls"><div id="left" class="ctrl">◀</div><div id="right" class="ctrl">▶</div><div id="brake" class="ctrl">▼</div><div id="gas" class="ctrl">▲</div></div>
<div id="phaseBanner"></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const screens=['menu','draw','garage','tracks','settings','weekend','result'];
function screen(id){screens.forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.getElementById('hud').style.display='none';document.getElementById('controls').style.display='none';document.getElementById('drawUI').style.display='none';document.getElementById('phaseBanner').style.display='none'}
function home(){try{screen('menu')}catch(e){document.getElementById('menu').style.display='block'}}
const cars=[
{name:'FORMULA X',top:315,acc:7.2,brake:10,grip:1.12,weight:720,color:'#e9283f'},
{name:'GT-RS',top:280,acc:5.7,brake:8.2,grip:1.2,weight:1300,color:'#2d8cff'},
{name:'SUPER V8',top:300,acc:6.3,brake:8.8,grip:1.03,weight:1050,color:'#f0b429'},
{name:'RALLY R',top:255,acc:6.8,brake:8.7,grip:1.28,weight:1120,color:'#7a5cff'}
];let car=0,difficulty=1,line=true,selectedTrack=null,tracks=JSON.parse(localStorage.getItem('tf_tracks')||'[]');
function showGarage(){screen('garage');document.getElementById('cars').innerHTML=cars.map((x,i)=>`<div class="card" style="border:2px solid ${i===car?x.color:'#263542'}"><b>${x.name}</b><div style="height:8px;background:${x.color};margin:10px 0;border-radius:5px"></div><div class="small">Vmax ${x.top} · Grip ${x.grip.toFixed(2)} · Bremse ${x.brake}</div><button style="margin-top:10px" onclick="selectCar(${i})">${i===car?'AUSGEWÄHLT':'AUSWÄHLEN'}</button></div>`).join('')}
function selectCar(i){car=i;showGarage()}
function showSettings(){screen('settings');document.getElementById('lineBtn').textContent=line?'AKTIV':'AUS'}
function toggleLine(){line=!line;showSettings()}
function showTracks(){screen('tracks');let a=tracks.map((t,i)=>`<div class="card"><b>${t.name}</b><div class="small">${t.points.length} Streckenpunkte</div><button style="margin-top:10px" onclick="selectedTrack=${i};startWeekend()">FAHREN</button></div>`).join('');document.getElementById('trackList').innerHTML=a||'<div class="card">Noch keine Strecken. Zeichne deine erste Strecke!</div>'}
function startWeekend(){if(selectedTrack===null&&tracks.length){selectedTrack=0} if(selectedTrack===null){selectedTrack=makeDefaultTrack();}screen('weekend');document.getElementById('weekendText').innerHTML=`<b>${trackName()}</b><br>Auto: ${cars[car].name}<br><span class="small">Training → Qualifying → Rennen</span>`}
function trackName(){return selectedTrack>=0&&selectedTrack<tracks.length?tracks[selectedTrack].name:'Test Circuit'}
function makeDefaultTrack(){let pts=[];for(let i=0;i<100;i++){let a=i/100*Math.PI*2;pts.push({x:.5+.32*Math.cos(a),y:.5+.23*Math.sin(a)})}tracks.push({name:'Sunset Loop',points:pts});saveTracks();return tracks.length-1}
function saveTracks(){localStorage.setItem('tf_tracks',JSON.stringify(tracks))}

let drawing=false,raw=[];
function startDraw(){screen('draw');raw=[];drawing=false;c.style.background='#14202a'}
c.addEventListener('pointerdown',e=>{if(document.getElementById('draw').style.display==='block'){drawing=true;raw=[{x:e.clientX/W,y:e.clientY/H}];}});
c.addEventListener('pointermove',e=>{if(drawing){raw.push({x:e.clientX/W,y:e.clientY/H});}});
addEventListener('pointerup',()=>{if(drawing){drawing=false;drawPreview()}})
function drawPreview(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#14202a';ctx.fillRect(0,0,W,H);if(raw.length<2)return;ctx.strokeStyle='#e9283f';ctx.lineWidth=5;ctx.beginPath();raw.forEach((p,i)=>i?ctx.lineTo(p.x*W,p.y*H):ctx.moveTo(p.x*W,p.y*H));ctx.stroke()}
function finishDraw(){
if(raw.length<12){alert('Bitte eine längere Strecke zeichnen.');return}
let pts=raw.filter((p,i)=>i%Math.max(1,Math.floor(raw.length/120))===0);
let smooth=[];for(let i=0;i<pts.length;i++){let a=pts[(i-1+pts.length)%pts.length],b=pts[i],d=pts[(i+1)%pts.length];smooth.push({x:(a.x+b.x+d.x)/3,y:(a.y+b.y+d.y)/3})}
tracks.push({name:'Meine Strecke '+tracks.length,points:smooth});saveTracks();selectedTrack=tracks.length-1;startWeekend()
}

let phase='',running=false,paused=false,startTime=0,elapsed=0,last=0,lap=0,totalLaps=5,bestLap=Infinity,lapStart=0,player,ais=[],track=[],center=[],trackW=45,off=0,tyreWear=0,stops=0,crashes=0,keys={};
function beginSession(p){
phase=p;screen('menu'); // hide menus for game
screens.forEach(x=>document.getElementById(x).style.display='none');
document.getElementById('hud').style.display='block';document.getElementById('controls').style.display='block';document.getElementById('pause').style.display='block';
buildTrack();initRace();showBanner(p==='practice'?'TRAINING':p==='qualify'?'QUALIFYING':'STARTAUFSTELLUNG',1100);
}
function buildTrack(){
let src=tracks[selectedTrack].points;center=src.map(p=>({x:p.x*W,y:p.y*H}));
let cx=center.reduce((s,p)=>s+p.x,0)/center.length,cy=center.reduce((s,p)=>s+p.y,0)/center.length;
let sx=Math.min(1,(W-70)/(Math.max(...center.map(p=>p.x))-Math.min(...center.map(p=>p.x))+1));
let sy=Math.min(1,(H-150)/(Math.max(...center.map(p=>p.y))-Math.min(...center.map(p=>p.y))+1));
let s=Math.min(sx,sy);center=center.map(p=>({x:cx+(p.x-cx)*s,y:cy+(p.y-cy)*s}));
track=center;
}
function initRace(){
let p=track[0],p2=track[1];player={x:p.x,y:p.y,ang:Math.atan2(p2.y-p.y,p2.x-p.x),v:0,lapDist:0,dist:0,off:false,damage:0};
ais=[];for(let i=0;i<6;i++){let q=track[(i*3)%track.length];ais.push({x:q.x,y:q.y,idx:(i*3)%track.length,v:cars[car].top*(.72+i*.025)*(difficulty===2?.96:1),lap:i%2?0:0,damage:0,crashed:false})}
lap=0;elapsed=0;bestLap=Infinity;lapStart=performance.now();tyreWear=0;stops=0;crashes=0;running=true;paused=false;last=performance.now();requestAnimationFrame(loop);
}
function showBanner(t,ms=900){let b=document.getElementById('phaseBanner');b.textContent=t;b.style.display='block';setTimeout(()=>b.style.display='none',ms)}
function nearest(x,y){let bi=0,bd=1e9;for(let i=0;i<track.length;i++){let dx=x-track[i].x,dy=y-track[i].y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}return {i:bi,d:Math.sqrt(bd)}}
function loop(now){if(!running)return;let dt=Math.min(.035,(now-last)/1000);last=now;if(!paused){update(dt,now);render()}requestAnimationFrame(loop)}
function update(dt,now){
let gas=keys.gas||keys.up,brake=keys.brake||keys.down,steer=(keys.right?1:0)-(keys.left?1:0);
let spec=cars[car],wearFactor=1-tyreWear/170;
if(phase==='practice'||phase==='qualify'||phase==='race'){
let accel=spec.acc*(gas?1:0)-spec.brake*(brake?1:0)-player.v*.9;
player.v=Math.max(0,Math.min(spec.top,player.v+accel*dt*20))*wearFactor;
player.ang+=steer*(1.8+player.v/180)*dt*(.7+spec.grip*.2);
player.x+=Math.cos(player.ang)*player.v*.28*dt;player.y+=Math.sin(player.ang)*player.v*.28*dt;
let n=nearest(player.x,player.y);player.off=n.d>trackW;
if(player.off){player.v*=Math.pow(.965,dt*60);off=.5}else off=0;
if(n.d>trackW*2){player.x=track[n.i].x;player.y=track[n.i].y;player.v*=.4;crashes++}
let idx=n.i,prev=player.lapIdx??idx;player.lapIdx=idx;
if(prev>track.length*.8&&idx<track.length*.2){lap++;let lt=(now-lapStart)/1000;if(lt>5)bestLap=Math.min(bestLap,lt);lapStart=now;if(phase==='race'&&lap>=totalLaps){finish();return}}
tyreWear=Math.min(100,tyreWear+dt*(player.v>120?.65:.3));
ais.forEach(ai=>aiUpdate(ai,dt));
if(phase==='qualify'&&elapsed>45000){phase='race';showBanner('RENNSTART');lap=0;lapStart=now}
elapsed=(now-startTime)/1000||elapsed;updateHud();
}}
function aiUpdate(ai,dt){
if(ai.crashed)return;let look=14+Math.floor(ai.v/35),target=track[(ai.idx+look)%track.length],dx=target.x-ai.x,dy=target.y-ai.y;
let desired=Math.atan2(dy,dx),a=Math.atan2(Math.sin(desired),Math.cos(desired));ai.x+=Math.cos(desired)*ai.v*.28*dt;ai.y+=Math.sin(desired)*ai.v*.28*dt;
ai.idx=(ai.idx+Math.max(1,Math.floor(ai.v*dt*.03)))%track.length;
if(Math.random()<.0007*(difficulty+1)){ai.crashed=true;crashes++;showBanner('KI CRASH!',500)}
}
function updateHud(){
let t=phase==='race'?((performance.now()-lapStart)/1000):elapsed;document.getElementById('lap').textContent=`Runde ${Math.min(lap+1,totalLaps)}/${totalLaps}`;
document.getElementById('time').textContent=fmt(elapsed);document.getElementById('best').textContent=bestLap<Infinity?fmt(bestLap):'--';
document.getElementById('speed').textContent=Math.round(player.v*.92);document.getElementById('tyre').textContent=`MEDIUM · ${Math.max(0,Math.round(100-tyreWear))}%`;
let ahead=ais.filter(a=>a.idx>player.lapIdx).length;document.getElementById('pos').textContent='P'+Math.min(7,1+Math.max(0,ahead%7));
}
function fmt(s){let m=Math.floor(s/60),x=(s%60).toFixed(3).padStart(6,'0');return `${m}:${x}`}
function render(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#1c5a32';ctx.fillRect(0,0,W,H);
drawDecor();drawTrack();if(line)drawLine();ais.forEach(drawAI);drawPlayer();
}
function pathStroke(points,width,style){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=style;ctx.stroke()}
function drawTrack(){pathStroke(track,trackW+18,'#cbd0d2');pathStroke(track,trackW+8,'#111820');pathStroke(track,trackW,'#3b4146');}
function drawLine(){pathStroke(track,2,'#f5df42')}
function drawDecor(){for(let i=0;i<track.length;i+=9){let p=track[i];let a=Math.atan2(p.y-track[(i+1)%track.length].y,p.x-track[(i+1)%track.length].x);let q={x:p.x+Math.cos(a)*55,y:p.y+Math.sin(a)*55};ctx.fillStyle='#2f733f';ctx.beginPath();ctx.arc(q.x,q.y,7,0,7);ctx.fill()}}
function drawPlayer(){drawCar(player.x,player.y,player.ang,cars[car].color,1)}
function drawAI(a){drawCar(a.x,a.y,Math.atan2(track[(a.idx+2)%track.length].y-a.y,track[(a.idx+2)%track.length].x-a.x),'#d8dce0',.8)}
function drawCar(x,y,a,col,scale){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#05080a';ctx.fillRect(-13*scale,-9*scale,28*scale,18*scale);ctx.fillStyle=col;ctx.fillRect(-11*scale,-7*scale,23*scale,14*scale);ctx.fillStyle='#9bd5ff';ctx.fillRect(0,-5*scale,7*scale,10*scale);ctx.restore()}
function finish(){running=false;document.getElementById('hud').style.display='none';document.getElementById('controls').style.display='none';document.getElementById('pause').style.display='none';screen('result');document.getElementById('resultTitle').textContent= '🏆 ZIEL!';document.getElementById('resultText').innerHTML=`<b>P1 – DU</b><br>Gesamtzeit: ${fmt(elapsed)}<br>Schnellste Runde: ${bestLap<Infinity?fmt(bestLap):'--'}<br>Boxenstopps: ${stops}<br>Unfälle: ${crashes}<br>Reifen: MEDIUM`}
}
function pauseGame(){if(!running)return;paused=!paused;showBanner(paused?'PAUSE':'WEITER',500)}
function pit(){if(!running||phase!=='race')return;stops++;player.v=0;tyreWear=Math.max(0,tyreWear-70);showBanner('BOXENSTOPP',1200)}
function bind(id,key){let e=document.getElementById(id);e.onpointerdown=()=>keys[key]=1;e.onpointerup=()=>keys[key]=0;e.onpointercancel=()=>keys[key]=0;e.onpointerleave=()=>keys[key]=0}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;if(e.key==='ArrowUp')keys.gas=1;if(e.key==='ArrowDown')keys.brake=1;if(e.key==='p')pauseGame();if(e.key==='b')pit()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;if(e.key==='ArrowUp')keys.gas=0;if(e.key==='ArrowDown')keys.brake=0});
c.addEventListener('dblclick',()=>pit());
home();
</script>
</body></html>
