<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Murder on the Aurora</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07111d;
  color:white;
  font-family:Arial,sans-serif;
}

button{
  font:inherit;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:block;
}

/* MENU */

#menu{
  background:
    radial-gradient(circle at 50% 35%,#23435d 0,#0d1d2c 45%,#050b12 100%);
  text-align:center;
  padding:70px 22px 30px;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 4px 20px #000;
}

.sub{
  color:#9fc1d7;
  margin:10px 0 50px;
  font-size:15px;
}

.bigBtn{
  width:min(360px,90%);
  border:0;
  border-radius:16px;
  padding:16px 18px;
  background:#e9f4fa;
  color:#08111a;
  font-weight:800;
  font-size:20px;
  margin:8px;
  box-shadow:0 8px 20px #0005;
}

/* GAME */

#game{
  background:#09131e;
}

.top{
  height:72px;
  padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0d1b29;
  border-bottom:1px solid #284156;
  position:relative;
  z-index:5;
}

.title{
  font-weight:900;
}

.stats{
  display:flex;
  gap:7px;
  font-size:12px;
}

.pill{
  background:#172c3d;
  padding:8px 10px;
  border-radius:12px;
}

#scene{
  position:absolute;
  top:72px;
  bottom:110px;
  left:0;
  right:0;
  overflow:hidden;
}

.room{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      #14293a 0 52%,
      #25313a 52% 100%
    );
}

.wall{
  position:absolute;
  left:7%;
  right:7%;
  top:8%;
  height:44%;
  border:3px solid #526d7d;
  background:
    linear-gradient(90deg,#203b4d,#132634);
  box-shadow:inset 0 0 50px #0008;
}

.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:48%;
  background:
    repeating-linear-gradient(
      90deg,
      #4a4037 0 55px,
      #40372f 55px 110px
    );
  transform:perspective(300px) rotateX(3deg);
  transform-origin:bottom;
}

.object{
  position:absolute;
  border:2px solid #7992a1;
  background:#263c4a;
  box-shadow:0 8px 15px #0008;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:800;
  color:#dcecf5;
}

.door{
  width:18%;
  height:42%;
  left:41%;
  top:17%;
  background:#382b22;
}

.window{
  width:24%;
  height:25%;
  left:10%;
  top:17%;
  background:linear-gradient(#4c9bc0,#182f42);
  border-color:#9ac7da;
}

.table{
  width:35%;
  height:18%;
  left:33%;
  bottom:25%;
  background:#594735;
}

.bed{
  width:40%;
  height:20%;
  right:8%;
  bottom:20%;
  background:#667e8c;
}

.interact{
  position:absolute;
  z-index:4;
  border:0;
  background:#ffffff18;
  color:#fff;
  border-radius:12px;
  padding:8px 10px;
  font-size:11px;
  font-weight:800;
  backdrop-filter:blur(4px);
}

/* DIALOG */

#dialog{
  position:absolute;
  left:10px;
  right:10px;
  bottom:120px;
  z-index:10;
  background:#0b1723f2;
  border:1px solid #49667a;
  border-radius:20px;
  padding:16px;
  box-shadow:0 15px 35px #0009;
  display:none;
}

#dialog.show{
  display:block;
}

#dialog h3{
  margin:0 0 7px;
}

.dialogText{
  color:#c9dbe5;
  line-height:1.4;
  font-size:14px;
  margin-bottom:12px;
}

.choices{
  display:grid;
  gap:8px;
}

.choice{
  border:1px solid #34566b;
  border-radius:14px;
  padding:12px;
  background:#183044;
  color:white;
  text-align:left;
  font-size:14px;
}

/* NAVIGATION */

#bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:110px;
  background:#0b1723;
  border-top:1px solid #284156;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:6;
}

.nav{
  background:#14283a;
  color:#d8eaf4;
  border:1px solid #29465a;
  border-radius:14px;
  padding:10px 12px;
  font-size:12px;
  font-weight:800;
}

/* TOAST */

#toast{
  position:absolute;
  top:82px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:#e9f4fa;
  color:#07111a;
  padding:11px 15px;
  border-radius:14px;
  font-weight:800;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:30;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* OVERLAY */

#overlay{
  position:absolute;
  inset:0;
  background:#02070de8;
  z-index:40;
  display:none;
  padding:25px 18px;
  padding-top:calc(25px + env(safe-area-inset-top));
  overflow:auto;
}

#overlay.show{
  display:block;
}

.panel{
  max-width:520px;
  margin:0 auto;
  background:#0c1925;
  border:1px solid #365266;
  border-radius:22px;
  padding:20px;
  box-shadow:0 20px 50px #000;
}

.panel h2{
  margin-top:0;
}

.close{
  float:right;
  background:#263f50;
  color:white;
  border:0;
  border-radius:10px;
  padding:7px 10px;
}

.clue{
  background:#132839;
  border-radius:13px;
  padding:11px;
  margin:8px 0;
  color:#cde0ea;
  font-size:14px;
}

#mapList{
  display:grid;
  gap:9px;
  margin-top:12px;
}

.roomBtn{
  background:#173043;
  border:1px solid #34566b;
  color:white;
  border-radius:14px;
  padding:14px;
  text-align:left;
  font-weight:800;
  width:100%;
}

.accuse{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}

.accuse button{
  border:0;
  border-radius:14px;
  padding:13px;
  background:#243f52;
  color:white;
  font-weight:800;
}

@media(max-height:650px){

  .logo{
    font-size:34px;
  }

  .sub{
    margin-bottom:25px;
  }

  #scene{
    bottom:100px;
  }

  #dialog{
    bottom:108px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- STARTMENÜ -->

<section id="menu" class="screen active">

  <div class="logo">
    MURDER<br>
    ON THE AURORA
  </div>

  <div class="sub">
    Ein Mystery-Abenteuer auf hoher See
  </div>

  <button class="bigBtn" onclick="startGame()">
    ▶ SPIEL STARTEN
  </button>

  <br>

  <button class="bigBtn" onclick="showHow()">
    ❓ SO SPIELST DU
  </button>

</section>


<!-- SPIEL -->

<section id="game" class="screen">

  <div class="top">

    <div class="title">
      🚢 MS AURORA
    </div>

    <div class="stats">

      <span class="pill">
        ⏱ <span id="time">22:00</span>
      </span>

      <span class="pill">
        🔎 <span id="clueCount">0</span>
      </span>

    </div>

  </div>


  <div id="scene"></div>

  <div id="dialog"></div>

  <div id="toast"></div>


  <div id="bottom">

    <button class="nav" onclick="openMap()">
      🗺️ KARTE
    </button>

    <button class="nav" onclick="openClues()">
      🔎 HINWEISE
    </button>

    <button class="nav" onclick="talkMenu()">
      👥 PERSONEN
    </button>

    <button class="nav" onclick="accusation()">
      ⚖️ ANKLAGE
    </button>

  </div>


  <div id="overlay"></div>

</section>

</div>


<script>

let state={
  room:"Kabine",
  clues:[],
  time:22*60,
  started:false,
  flags:{}
};


const rooms={

  "Kabine":{
    type:"cabin"
  },

  "Deck 7":{
    type:"deck"
  },

  "Lounge":{
    type:"lounge"
  },

  "Fitnessraum":{
    type:"gym"
  },

  "Brücke":{
    type:"bridge"
  }

};


function startGame(){

  state={
    room:"Kabine",
    clues:[],
    time:22*60,
    started:true,
    flags:{}
  };

  show("game");

  renderRoom();

  document.getElementById("clueCount").textContent="0";
  document.getElementById("time").textContent="22:00";

  toast("Der Alarm wurde ausgelöst!");

  setTimeout(()=>{

    dialog(
      "Tatort",
      "Ein Passagier wurde in Kabine 214 tot aufgefunden. Untersuche die Umgebung und finde heraus, was passiert ist.",
      "🔍 UNTERSUCHEN",
      "investigate"
    );

  },500);

  clearInterval(window.clock);

  window.clock=setInterval(tick,1000);
}


function show(id){

  document
    .querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");
}


function tick(){

  if(!state.started) return;

  state.time++;

  document.getElementById("time").textContent=fmt(state.time);

}


function fmt(t){

  return String(Math.floor(t/60)).padStart(2,"0")
       +":"
       +String(t%60).padStart(2,"0");

}


function toast(text){

  const x=document.getElementById("toast");

  x.textContent=text;

  x.classList.add("show");

  setTimeout(()=>{
    x.classList.remove("show");
  },2200);

}


function clue(id){

  if(!state.clues.includes(id)){

    state.clues.push(id);

    document.getElementById("clueCount").textContent=
      state.clues.length;

    toast("🔎 Neuer Hinweis!");

  }

  state.flags[id]=true;

}


function dialog(title,text,button,action){

  const d=document.getElementById("dialog");

  d.innerHTML=`

    <h3>${title}</h3>

    <div class="dialogText">
      ${text}
    </div>

    <div class="choices">

      <button class="choice"
        onclick="${action}()">

        ${button}

      </button>

    </div>
  `;

  d.classList.add("show");

}


function multiDialog(title,text,buttons){

  const d=document.getElementById("dialog");

  d.innerHTML=`

    <h3>${title}</h3>

    <div class="dialogText">
      ${text}
    </div>

    <div class="choices">

      ${buttons.map(b=>`

        <button class="choice"
          onclick="${b[1]}">

          ${b[0]}

        </button>

      `).join("")}

    </div>

  `;

  d.classList.add("show");

}


function closeDialog(){

  document
    .getElementById("dialog")
    .classList.remove("show");

}


/* TATORT */

function investigate(){

  closeDialog();

  if(state.room!=="Kabine"){

    go("Kabine");

    return;

  }


  if(!state.flags.window){

    dialog(
      "Fenster",
      "Das Fenster ist geschlossen. Am Rahmen hängt ein winziger blauer Faden.",
      "🔎 FADEN UNTERSUCHEN",
      "inspectWindow"
    );

    return;

  }


  if(!state.flags.clock){

    dialog(
      "Wanduhr",
      "Die Wanduhr steht bei 22:41. Der Alarm wurde aber erst um 22:45 ausgelöst.",
      "🔎 UHR ALS HINWEIS SICHERN",
      "inspectClock"
    );

    return;

  }


  if(!state.flags.ticket){

    dialog(
      "Koffer",
      "Im Koffer liegt ein altes Foto. Darauf steht: „Deck 7 – 22:30“.",
      "🔎 FOTO UNTERSUCHEN",
      "inspectTicket"
    );

    return;

  }


  dialog(
    "Kabine",
    "Du hast die wichtigsten Hinweise gefunden. Jetzt solltest du die Verdächtigen befragen.",
    "👥 PERSONEN BEFRAGEN",
    "talkMenu"
  );

}


function inspectWindow(){

  clue("window");

  dialog(
    "Hinweis",
    "Der blaue Faden könnte von einer Jacke stammen.",
    "WEITER",
    "investigate"
  );

}


function inspectClock(){

  clue("clock");

  dialog(
    "Hinweis",
    "Die Uhr blieb um 22:41 stehen – vier Minuten vor dem Alarm.",
    "WEITER",
    "investigate"
  );

}


function inspectTicket(){

  clue("ticket");

  dialog(
    "Hinweis",
    "Das Foto beweist, dass sich jemand um 22:30 auf Deck 7 treffen sollte.",
    "WEITER",
    "investigate"
  );

}


/* RÄUME */

function renderRoom(){

  const s=document.getElementById("scene");

  let html=
    `<div class="room">
      <div class="wall"></div>
      <div class="floor"></div>`;


  if(state.room==="Kabine"){

    html+=`

      <div class="object door">
        KABINE 214
      </div>

      <div class="object window">
        🌧️<br>
        FENSTER
      </div>

      <div class="object table">
        TISCH
      </div>

      <div class="object bed">
        🛏️
      </div>

      <button class="interact"
        style="left:10%;top:43%"
        onclick="inspectWindow()">

        🔎 Fenster

      </button>

      <button class="interact"
        style="left:43%;bottom:41%"
        onclick="investigate()">

        🔎 Untersuchen

      </button>

      <button class="interact"
        style="right:8%;bottom:36%"
        onclick="inspectTicket()">

        🔎 Koffer

      </button>

    `;

  }


  else if(state.room==="Deck 7"){

    html+=`

      <div class="object"
        style="left:0;right:0;top:16%;height:15%;background:#172a35">

        🌊 STURM • OZEAN

      </div>

      <div class="object"
        style="left:10%;bottom:24%;width:80%;height:13%">

        🛟 RETTUNGSBOOTE

      </div>

      <div class="object"
        style="left:38%;bottom:48%;width:24%;height:16%">

        TÜR

      </div>

    `;

  }


  else if(state.room==="Lounge"){

    html+=`

      <div class="object"
        style="left:10%;bottom:23%;width:34%;height:18%">

        🛋️ SOFA

      </div>

      <div class="object"
        style="right:10%;bottom:23%;width:25%;height:20%">

        🍽️ BAR

      </div>

      <div class="object"
        style="left:40%;top:20%;width:20%;height:16%">

        🌊 MEER

      </div>

    `;

  }


  else if(state.room==="Fitnessraum"){

    html+=`

      <div class="object"
        style="left:10%;bottom:23%;width:25%;height:25%">

        🏋️ GEWICHTE

      </div>

      <div class="object"
        style="left:42%;bottom:23%;width:25%;height:18%">

        🚴 TRAINER

      </div>

      <div class="object"
        style="right:8%;bottom:23%;width:18%;height:28%">

        🪞 SPIEGEL

      </div>

    `;

  }


  else if(state.room==="Brücke"){

    html+=`

      <div class="object"
        style="left:8%;top:17%;width:84%;height:24%">

        🖥️ STEUERUNG<br>
        🌊🌊🌊

      </div>

      <div class="object"
        style="left:35%;bottom:24%;width:30%;height:25%">

        🧭 BRÜCKE

      </div>

    `;

  }


  html+=`</div>`;

  s.innerHTML=html;

}


function go(room){

  state.room=room;

  renderRoom();

  toast("📍 "+room);

}


/* KARTE */

function openMap(){

  const o=document.getElementById("overlay");

  o.innerHTML=`

    <div class="panel">

      <button class="close"
        onclick="closeOverlay()">

        ✕

      </button>

      <h2>🗺️ Schiffskarte</h2>

      <p>Wähle einen Ort:</p>

      <div id="mapList">

        ${Object.keys(rooms).map(x=>`

          <button class="roomBtn"
            onclick="go('${x}');closeOverlay()">

            📍 ${x}

          </button>

        `).join("")}

      </div>

    </div>

  `;

  o.classList.add("show");

}


/* HINWEISE */

function openClues(){

  let text="";

  if(state.clues.length===0){

    text=`
      <div class="clue">
        Noch keine Hinweise gefunden.
      </div>
    `;

  }else{

    const names={
      window:"Blauer Faden am Fenster",
      clock:"Uhr stoppte bei 22:41",
      ticket:"Foto: Treffen auf Deck 7 um 22:30"
    };

    text=state.clues
      .map(id=>`
        <div class="clue">
          🔎 ${names[id]}
        </div>
      `)
      .join("");

  }


  const o=document.getElementById("overlay");

  o.innerHTML=`

    <div class="panel">

      <button class="close"
        onclick="closeOverlay()">

        ✕

      </button>

      <h2>🔎 Deine Hinweise</h2>

      ${text}

    </div>

  `;

  o.classList.add("show");

}


/* PERSONEN */

function talkMenu(){

  closeOverlay();

  const o=document.getElementById("overlay");

  o.innerHTML=`

    <div class="panel">

      <button class="close"
        onclick="closeOverlay()">

        ✕

      </button>

      <h2>👥 Verdächtige</h2>

      <button class="roomBtn"
        onclick="question('captain')">

        👨‍✈️ Kapitän Weber

      </button>

      <br><br>

      <button class="roomBtn"
        onclick="question('sofia')">

        👩 Sofia

      </button>

      <br><br>

      <button class="roomBtn"
        onclick="question('leon')">

        👨 Leon

      </button>

      <br><br>

      <button class="roomBtn"
        onclick="question('marco')">

        🧑 Marco

      </button>

    </div>

  `;

  o.classList.add("show");

}


function question(who){

  closeOverlay();


  if(who==="captain"){

    multiDialog(
      "Kapitän Weber",
      "„Um 22:45 habe ich den Alarm ausgelöst. Vorher war ich auf der Brücke.“",
      [
        ["🔎 Nach der Tür fragen","askCaptainDoor()"],
        ["↩️ Zurück","talkMenu()"]
      ]
    );

  }


  if(who==="sofia"){

    multiDialog(
      "Sofia",
      "„Ich war gegen 22:30 in der Lounge. Danach bin ich kurz auf Deck 7 gegangen.“",
      [
        ["🔎 Jacke fragen","askSofiaJacket()"],
        ["↩️ Zurück","talkMenu()"]
      ]
    );

  }


  if(who==="leon"){

    multiDialog(
      "Leon",
      "„Ich war im Fitnessraum und bin danach in meine Kabine gegangen.“",
      [
        ["🔎 Kleidung fragen","askLeonClothes()"],
        ["↩️ Zurück","talkMenu()"]
      ]
    );

  }


  if(who==="marco"){

    multiDialog(
      "Marco",
      "„Ich war auf Deck 7. Aber ich habe dort niemanden getroffen.“ Er wirkt nervös.",
      [
        ["🔎 Treffen erwähnen","askMarcoMeeting()"],
        ["↩️ Zurück","talkMenu()"]
      ]
    );

  }

}


/* BEFRAGUNG */

function askCaptainDoor(){

  clue("door");

  dialog(
    "Kapitän Weber",
    "„Das Zugangssystem zeichnet jede Tür auf. Die Kabine wurde um 22:38 geöffnet.“",
    "WEITER",
    "talkMenu"
  );

}


function askSofiaJacket(){

  clue("bluejacket");

  dialog(
    "Sofia",
    "„Ja, meine Jacke ist blau. Aber daraus kannst du nichts schließen.“",
    "WEITER",
    "talkMenu"
  );

}


function askLeonClothes(){

  clue("dryclothes");

  dialog(
    "Leon",
    "„Meine Kleidung ist trocken. Ich war die ganze Zeit drinnen.“",
    "WEITER",
    "talkMenu"
  );

}


function askMarcoMeeting(){

  clue("marco");

  dialog(
    "Marco",
    "„Ich war dort, aber ich habe niemanden getroffen.“ Seine Aussage passt nicht ganz zum Foto.",
    "WEITER",
    "talkMenu"
  );

}


/* ANKLAGE */

function accusation(){

  const o=document.getElementById("overlay");

  o.innerHTML=`

    <div class="panel">

      <button class="close"
        onclick="closeOverlay()">

        ✕

      </button>

      <h2>⚖️ WEN BESCHULDIGST DU?</h2>

      <p>
        Du darfst nur eine Person beschuldigen.
      </p>

      <div class="accuse">

        <button onclick="ending('captain')">
          👨‍✈️ Weber
        </button>

        <button onclick="ending('sofia')">
          👩 Sofia
        </button>

        <button onclick="ending('leon')">
          👨 Leon
        </button>

        <button onclick="ending('marco')">
          🧑 Marco
        </button>

      </div>

    </div>

  `;

  o.classList.add("show");

}


/* ENDE */

function ending(who){

  closeOverlay();

  let correct=who==="marco";

  if(correct){

    dialog(
      "🎉 FALL GELÖST!",
      "Marco war der Täter. Die Hinweise auf Deck 7, der Zeitablauf und seine widersprüchliche Aussage haben ihn verraten.",
      "🔄 NOCHMAL SPIELEN",
      "startGame"
    );

  }else{

    dialog(
      "❌ FALSCHE ANKLAGE",
      "Deine Anklage passt nicht zu allen Hinweisen. Der wahre Täter konnte entkommen.",
      "🔄 NOCHMAL SPIELEN",
      "startGame"
    );

  }

}
