<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>TrackDraw Racing</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow:hidden;
  background:#090b0f;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

button{
  border:0;
  outline:0;
  font:inherit;
}

#app{
  width:100%;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#202631 0,#0c0f14 55%,#050608 100%);
}

/* =========================
   MENÜ
========================= */

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
}

.screen.active{
  display:flex;
}

.menu{
  align-items:center;
  justify-content:center;
  padding:25px;
}

.logo{
  font-size:42px;
  font-weight:1000;
  letter-spacing:-3px;
  font-style:italic;
  margin-bottom:5px;
}

.logo span{
  color:#ff3b30;
}

.subtitle{
  color:#8e969f;
  margin-bottom:35px;
  font-size:14px;
}

.menuButtons{
  width:min(390px,90%);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.menuBtn{
  min-height:58px;
  border-radius:15px;
  background:#191e25;
  border:1px solid #303740;
  color:white;
  font-weight:900;
  font-size:17px;
}

.menuBtn.primary{
  background:#e52d25;
  border-color:#ff5047;
  box-shadow:0 7px 25px #ff332733;
}

.menuBtn:active{
  transform:scale(.97);
}

/* =========================
   TOP BAR
========================= */

.top{
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#0b0d11dd;
  border-bottom:1px solid #252a31;
  z-index:10;
}

.topTitle{
  font-weight:1000;
  font-size:20px;
}

.back{
  width:45px;
  height:45px;
  border-radius:12px;
  background:#1a1f26;
  color:white;
  font-size:22px;
}

.action{
  min-height:44px;
  padding:0 16px;
  border-radius:12px;
  background:#e52d25;
  color:white;
  font-weight:900;
}

/* =========================
   DRAW
========================= */

.drawScreen{
  background:#101318;
}

.drawArea{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:
    linear-gradient(#ffffff08 1px,transparent 1px),
    linear-gradient(90deg,#ffffff08 1px,transparent 1px),
    #15191e;
  background-size:30px 30px;
  touch-action:none;
}

#drawCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.drawInfo{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  pointer-events:none;
}

.infoBox{
  display:inline-block;
  padding:9px 12px;
  border-radius:10px;
  background:#080a0dcc;
  border:1px solid #ffffff15;
  font-size:12px;
  color:#bfc5cb;
}

.drawBottom{
  padding:12px;
  display:flex;
  gap:9px;
  background:#0b0d11;
  border-top:1px solid #252a31;
}

.drawBottom button{
  flex:1;
  height:50px;
  border-radius:13px;
  background:#20252c;
  color:white;
  font-weight:900;
}

.drawBottom .go{
  background:#e52d25;
}

/* =========================
   GARAGE
========================= */

.garage{
  padding:20px;
  overflow:auto;
}

.carGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  max-width:600px;
  margin:auto;
}

.carCard{
  background:#171b21;
  border:1px solid #303640;
  border-radius:18px;
  padding:15px;
  min-height:170px;
}

.carCard.selected{
  border:2px solid #ff3b30;
  background:#211719;
}

.carVisual{
  height:85px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.miniCar{
  width:115px;
  height:30px;
  background:#e52d25;
  border-radius:45% 55% 25% 25%;
  position:relative;
  transform:skewX(-8deg);
}

.miniCar:before{
  content:"";
  position:absolute;
  width:48px;
  height:18px;
  background:#222a33;
  left:35px;
  top:-10px;
  border-radius:8px 12px 2px 2px;
}

.wheel{
  position:absolute;
  width:19px;
  height:19px;
  background:#080909;
  border-radius:50%;
  bottom:-9px;
}

.w1{left:16px}
.w2{right:16px}

.carName{
  font-weight:1000;
}

.carStats{
  color:#89919b;
  font-size:12px;
  margin-top:5px;
}

/* =========================
   RACE
========================= */

.race{
  background:#090b0e;
}

#raceCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.hud{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.hudTop{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
}

.hudBox{
  padding:10px 13px;
  border-radius:12px;
  background:#07090dcc;
  border:1px solid #ffffff16;
  font-weight:900;
  font-size:13px;
}

.controls{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:auto;
}

.steer{
  display:flex;
  gap:10px;
}

.controlBtn{
  width:68px;
  height:68px;
  border-radius:50%;
  background:#161b21d9;
  border:1px solid #ffffff22;
  color:white;
  font-size:25px;
  font-weight:900;
  touch-action:none;
}

.controlBtn:active{
  background:#303640;
}

.brake{
  background:#b8201bd9;
  font-size:15px;
}

.pause{
  position:absolute;
  top:80px;
  right:15px;
  width:45px;
  height:45px;
  border-radius:12px;
  background:#11151bdd;
  color:white;
  pointer-events:auto;
}

/* =========================
   RESULT
========================= */

.result{
  align-items:center;
  justify-content:center;
  padding:25px;
  background:#080a0e;
}

.result h1{
  font-size:42px;
  margin:0 0 8px;
}

.resultTime{
  font-size:28px;
  font-weight:1000;
  color:#ff493f;
  margin-bottom:30px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){
  .logo{font-size:35px}
  .controlBtn{
    width:60px;
    height:60px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= MENU ================= -->

<section id="menu" class="screen active menu">

  <div class="logo">
    TRACK<span>DRAW</span>
  </div>

  <div class="subtitle">
    DRAW • DRIVE • RACE
  </div>

  <div class="menuButtons">
    <button class="menuBtn primary" id="drawBtn">
      ✏️ STRECKE ZEICHNEN
    </button>

    <button class="menuBtn" id="garageBtn">
      🚗 GARAGE
    </button>

    <button class="menuBtn" id="raceBtn">
      🏁 FAHREN
    </button>
  </div>

</section>


<!-- ================= DRAW ================= -->

<section id="drawScreen" class="screen drawScreen">

  <div class="top">
    <button class="back" id="drawBack">‹</button>
    <div class="topTitle">STRECKE ZEICHNEN</div>
    <button class="action" id="finishDraw">FERTIG</button>
  </div>

  <div class="drawArea">

    <canvas id="drawCanvas"></canvas>

    <div class="drawInfo">
      <div class="infoBox">
        Zeichne eine geschlossene Rennstrecke
      </div>
    </div>

  </div>

  <div class="drawBottom">
    <button id="clearDraw">
      LÖSCHEN
    </button>

    <button id="smoothDraw">
      GLÄTTEN
    </button>

    <button class="go" id="useTrack">
      FAHREN
    </button>
  </div>

</section>


<!-- ================= GARAGE ================= -->

<section id="garage" class="screen">

  <div class="top">
    <button class="back" id="garageBack">‹</button>
    <div class="topTitle">GARAGE</div>
    <div style="width:45px"></div>
  </div>

  <div class="garage">

    <div class="carGrid">

      <div class="carCard selected" data-car="formula">
        <div class="carVisual">
          <div class="miniCar">
            <i class="wheel w1"></i>
            <i class="wheel w2"></i>
          </div>
        </div>
        <div class="carName">FORMULA X</div>
        <div class="carStats">★★★★★ Geschwindigkeit</div>
      </div>

      <div class="carCard" data-car="gt">
        <div class="carVisual">
          <div class="miniCar" style="background:#3182ce">
            <i class="wheel w1"></i>
            <i class="wheel w2"></i>
          </div>
        </div>
        <div class="carName">GT-RS</div>
        <div class="carStats">★★★★☆ Kontrolle</div>
      </div>

      <div class="carCard" data-car="v8">
        <div class="carVisual">
          <div class="miniCar" style="background:#f1b52b">
            <i class="wheel w1"></i>
            <i class="wheel w2"></i>
          </div>
        </div>
        <div class="carName">SUPER V8</div>
        <div class="carStats">★★★★★ Power</div>
      </div>

      <div class="carCard" data-car="rally">
        <div class="carVisual">
          <div class="miniCar" style="background:#39a852">
            <i class="wheel w1"></i>
            <i class="wheel w2"></i>
          </div>
        </div>
        <div class="carName">RALLY R</div>
        <div class="carStats">★★★★★ Grip</div>
      </div>

    </div>

  </div>

</section>


<!-- ================= RACE ================= -->

<section id="race" class="screen race">

  <canvas id="raceCanvas"></canvas>

  <div class="hud">

    <div class="hudTop">
      <div class="hudBox">
        LAP <span id="lap">1</span>/3
      </div>

      <div class="hudBox">
        <span id="time">0.00</span>
      </div>
    </div>

    <button class="pause" id="pauseBtn">
      II
    </button>

    <div class="controls">

      <div class="steer">
        <button class="controlBtn" id="leftBtn">
          ‹
        </button>

        <button class="controlBtn" id="rightBtn">
          ›
        </button>
      </div>

      <button class="controlBtn brake" id="brakeBtn">
        BRAKE
      </button>

    </div>

  </div>

</section>


<!-- ================= RESULT ================= -->

<section id="result" class="screen result">

  <h1>🏁 FINISH</h1>

  <div class="resultTime" id="finalTime">
    0.00 s
  </div>

  <button class="menuBtn primary" id="againBtn">
    NOCHMAL FAHREN
  </button>

  <button class="menuBtn" id="resultMenuBtn">
    HAUPTMENÜ
  </button>

</section>

</div>


<script>
/* ============================================================
   TRACKDRAW ENGINE
============================================================ */

const $ = id => document.getElementById(id);

const screens = {
  menu: $("menu"),
  draw: $("drawScreen"),
  garage: $("garage"),
  race: $("race"),
  result: $("result")
};

function show(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}


/* ============================================================
   STATE
============================================================ */

let selectedCar = "formula";

let track = [];

let raceState = {
  running:false,
  paused:false,
  progress:0,
  lap:1,
  startTime:0,
  elapsed:0,
  speed:0,
  angle:0,
  x:0,
  y:0,
  crashed:false
};


/* ============================================================
   DRAW CANVAS
============================================================ */

const drawCanvas = $("drawCanvas");
const dctx = drawCanvas.getContext("2d");

let drawing = false;

function resizeDrawCanvas(){

  const rect = drawCanvas.parentElement.getBoundingClientRect();

  drawCanvas.width = Math.max(300,Math.floor(rect.width));
  drawCanvas.height = Math.max(300,Math.floor(rect.height));

  drawTrack();
}

function drawTrack(){

  dctx.clearRect(
    0,
    0,
    drawCanvas.width,
    drawCanvas.height
  );

  if(track.length < 2){

    dctx.fillStyle = "#707780";
    dctx.font = "bold 18px Arial";
    dctx.textAlign = "center";

    dctx.fillText(
      "Finger gedrückt halten und Strecke zeichnen",
      drawCanvas.width/2,
      drawCanvas.height/2
    );

    return;
  }

  /* OUTER ROAD */

  dctx.beginPath();

  dctx.moveTo(track[0].x,track[0].y);

  for(let i=1;i<track.length;i++){
    dctx.lineTo(track[i].x,track[i].y);
  }

  dctx.closePath();

  dctx.lineCap = "round";
  dctx.lineJoin = "round";

  dctx.strokeStyle = "#858b91";
  dctx.lineWidth = 105;
  dctx.stroke();


  /* ASPHALT */

  dctx.beginPath();

  dctx.moveTo(track[0].x,track[0].y);

  for(let i=1;i<track.length;i++){
    dctx.lineTo(track[i].x,track[i].y);
  }

  dctx.closePath();

  dctx.strokeStyle = "#272b30";
  dctx.lineWidth = 76;
  dctx.stroke();


  /* IDEALLINIE */

  dctx.beginPath();

  dctx.moveTo(track[0].x,track[0].y);

  for(let i=1;i<track.length;i++){
    dctx.lineTo(track[i].x,track[i].y);
  }

  dctx.closePath();

  dctx.strokeStyle = "#ffffff";
  dctx.lineWidth = 2;
  dctx.setLineDash([14,14]);
  dctx.stroke();
  dctx.setLineDash([]);


  /* START */

  const p = track[0];

  dctx.save();

  dctx.translate(p.x,p.y);

  dctx.fillStyle = "white";

  dctx.fillRect(
    -30,
    -38,
    60,
    76
  );

  for(let x=-30;x<30;x+=15){

    for(let y=-38;y<38;y+=15){

      if(
        ((x+30)/15 + (y+38)/15) % 2 === 0
      ){

        dctx.fillStyle = "#111";

        dctx.fillRect(
          x,
          y,
          15,
          15
        );

      }

    }

  }

  dctx.restore();
}


/* ============================================================
   DRAWING
============================================================ */

function drawPosition(e){

  const rect = drawCanvas.getBoundingClientRect();

  return {
    x:(e.clientX-rect.left)*
      drawCanvas.width/rect.width,

    y:(e.clientY-rect.top)*
      drawCanvas.height/rect.height
  };
}


drawCanvas.addEventListener(
  "pointerdown",
  e => {

    if(screens.draw.classList.contains("active") === false)
      return;

    drawing = true;

    track = [
      drawPosition(e)
    ];

    drawCanvas.setPointerCapture(e.pointerId);

    drawTrack();
  }
);


drawCanvas.addEventListener(
  "pointermove",
  e => {

    if(!drawing)
      return;

    const p = drawPosition(e);

    const last =
      track[track.length-1];

    const distance =
      Math.hypot(
        p.x-last.x,
        p.y-last.y
      );

    if(distance > 5){

      track.push(p);

      drawTrack();
    }
  }
);


drawCanvas.addEventListener(
  "pointerup",
  () => {

    drawing = false;

  }
);


drawCanvas.addEventListener(
  "pointercancel",
  () => {

    drawing = false;

  }
);


/* ============================================================
   SMOOTH TRACK
============================================================ */

function smoothTrack(){

  if(track.length < 8)
    return;

  const result = [];

  for(let i=0;i<track.length;i++){

    const prev =
      track[
        (i-1+track.length)%track.length
      ];

    const cur =
      track[i];

    const next =
      track[
        (i+1)%track.length
      ];

    result.push({

      x:
        (prev.x +
        cur.x*2 +
        next.x)/4,

      y:
        (prev.y +
        cur.y*2 +
        next.y)/4

    });
  }

  track = result;

  drawTrack();
}


/* ============================================================
   GARAGE
============================================================ */

document
.querySelectorAll(".carCard")
.forEach(card => {

  card.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(".carCard")
      .forEach(c =>
        c.classList.remove("selected")
      );

      card.classList.add("selected");

      selectedCar =
        card.dataset.car;
    }
  );

});


/* ============================================================
   RACE CANVAS
============================================================ */

const raceCanvas = $("raceCanvas");
const rctx = raceCanvas.getContext("2d");

function resizeRace(){

  raceCanvas.width =
    window.innerWidth;

  raceCanvas.height =
    window.innerHeight;
}


/* ============================================================
   TRACK FOR RACE
============================================================ */

function createDefaultTrack(){

  if(track.length > 20)
    return;

  const w = raceCanvas.width;
  const h = raceCanvas.height;

  track = [];

  const cx = w/2;
  const cy = h/2;

  const rx =
    Math.min(w*0.35,260);

  const ry =
    Math.min(h*0.27,210);

  for(let i=0;i<160;i++){

    const a =
      Math.PI*2*i/160;

    track.push({

      x:cx+
        Math.cos(a)*rx,

      y:cy+
        Math.sin(a)*ry

    });
  }
}


/* ============================================================
   RACE RENDER
============================================================ */

function renderRace(){

  rctx.clearRect(
    0,
    0,
    raceCanvas.width,
    raceCanvas.height
  );

  if(track.length < 2)
    return;


  /* ROAD */

  rctx.beginPath();

  rctx.moveTo(
    track[0].x,
    track[0].y
  );

  for(let i=1;i<track.length;i++){

    rctx.lineTo(
      track[i].x,
      track[i].y
    );
  }

  rctx.closePath();

  rctx.lineCap = "round";
  rctx.lineJoin = "round";

  rctx.strokeStyle = "#7c8187";
  rctx.lineWidth = 112;
  rctx.stroke();


  /* ASPHALT */

  rctx.beginPath();

  rctx.moveTo(
    track[0].x,
    track[0].y
  );

  for(let i=1;i<track.length;i++){

    rctx.lineTo(
      track[i].x,
      track[i].y
    );
  }

  rctx.closePath();

  rctx.strokeStyle = "#272a2e";
  rctx.lineWidth = 80;
  rctx.stroke();


  /* IDEAL LINE */

  rctx.beginPath();

  rctx.moveTo(
    track[0].x,
    track[0].y
  );

  for(let i=1;i<track.length;i++){

    rctx.lineTo(
      track[i].x,
      track[i].y
    );
  }

  rctx.closePath();

  rctx.strokeStyle =
    "rgba(255,255,255,.25)";

  rctx.lineWidth = 2;

  rctx.setLineDash([12,12]);

  rctx.stroke();

  rctx.setLineDash([]);


  /* CAR */

  drawRaceCar();
}


/* ============================================================
   CAR
============================================================ */

function drawRaceCar(){

  const index =
    Math.floor(
      raceState.progress %
      track.length
    );

  const p =
    track[index];

  const next =
    track[
      (index+2)%
      track.length
    ];

  const angle =
    Math.atan2(
      next.y-p.y,
      next.x-p.x
    );

  rctx.save();

  rctx.translate(
    p.x,
    p.y
  );

  rctx.rotate(angle);

  let carColor =
    "#e52d25";

  if(selectedCar === "gt")
    carColor = "#3182ce";

  if(selectedCar === "v8")
    carColor = "#f1b52b";

  if(selectedCar === "rally")
    carColor = "#39a852";


  /* shadow */

  rctx.fillStyle =
    "rgba(0,0,0,.4)";

  rctx.fillRect(
    -24,
    -11,
    48,
    25
  );


  /* body */

  rctx.fillStyle =
    carColor;

  rctx.beginPath();

  rctx.roundRect(
    -22,
    -9,
    44,
    18,
    5
  );

  rctx.fill();


  /* cockpit */

  rctx.fillStyle =
    "#18202a";

  rctx.beginPath();

  rctx.roundRect(
    -4,
    -7,
    15,
    14,
    3
  );

  rctx.fill();


  /* wheels */

  rctx.fillStyle =
    "#070707";

  rctx.fillRect(
    -15,
    -12,
    9,
    6
  );

  rctx.fillRect(
    -15,
    6,
    9,
    6
  );

  rctx.fillRect(
    9,
    -12,
    9,
    6
  );

  rctx.fillRect(
    9,
    6,
    9,
    6
  );


  rctx.restore();
}


/* ============================================================
   CONTROLS
============================================================ */

let leftPressed = false;
let rightPressed = false;
let brakePressed = false;


function holdButton(
  element,
  setter
){

  element.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      setter(true);

    }
  );

  element.addEventListener(
    "pointerup",
    e => {

      e.preventDefault();

      setter(false);

    }
  );

  element.addEventListener(
    "pointercancel",
    () => setter(false)
  );

  element.addEventListener(
    "pointerleave",
    () => setter(false)
  );
}


holdButton(
  $("leftBtn"),
  v => leftPressed=v
);

holdButton(
  $("rightBtn"),
  v => rightPressed=v
);

holdButton(
  $("brakeBtn"),
  v => brakePressed=v
);


/* ============================================================
   RACE PHYSICS
============================================================ */

let lastFrame = 0;

function raceLoop(timestamp){

  if(!raceState.running){

    lastFrame = timestamp;

    requestAnimationFrame(
      raceLoop
    );

    return;
  }

  const dt =
    Math.min(
      (timestamp-lastFrame)/1000,
      0.04
    );

  lastFrame = timestamp;


  if(!raceState.paused){

    let acceleration = 0.65;

    if(brakePressed)
      acceleration = -1.5;


    raceState.speed +=
      acceleration*dt;


    raceState.speed =
      Math.max(
        0,
        Math.min(
          90,
          raceState.speed
        )
      );


    if(leftPressed)
      raceState.progress -=
        28*dt;

    if(rightPressed)
      raceState.progress +=
        28*dt;


    raceState.progress +=
      raceState.speed*dt;


    if(raceState.progress >= track.length){

      raceState.progress -=
        track.length;

      raceState.lap++;

      $("lap").textContent =
        raceState.lap;


      if(raceState.lap > 3){

        finishRace();

        requestAnimationFrame(
          raceLoop
        );

        return;
      }
    }


    raceState.elapsed =
      (performance.now() -
       raceState.startTime)/1000;

    $("time").textContent =
      raceState.elapsed.toFixed(2);
  }


  renderRace();

  requestAnimationFrame(
    raceLoop
  );
}


/* ============================================================
   START RACE
============================================================ */

function startRace(){

  resizeRace();

  createDefaultTrack();

  show("race");

  raceState = {

    running:true,

    paused:false,

    progress:0,

    lap:1,

    startTime:performance.now(),

    elapsed:0,

    speed:10,

    angle:0,

    x:0,

    y:0,

    crashed:false
  };

  $("lap").textContent = "1";
  $("time").textContent = "0.00";

  requestAnimationFrame(
    raceLoop
  );
}


/* ============================================================
   FINISH
============================================================ */

function finishRace(){

  raceState.running = false;

  $("finalTime").textContent =
    raceState.elapsed.toFixed(2)
    + " s";

  show("result");
}


/* ============================================================
   BUTTONS
============================================================ */

$("drawBtn").addEventListener(
  "click",
  () => {

    show("draw");

    setTimeout(
      resizeDrawCanvas,
      20
    );
  }
);


$("garageBtn").addEventListener(
  "click",
  () => show("garage")
);


$("raceBtn").addEventListener(
  "click",
  () => {

    startRace();

  }
);


$("drawBack").addEventListener(
  "click",
  () => show("menu")
);


$("garageBack").addEventListener(
  "click",
  () => show("menu")
);


$("clearDraw").addEventListener(
  "click",
  () => {

    track = [];

    drawTrack();

  }
);


$("smoothDraw").addEventListener(
  "click",
  smoothTrack
);


$("finishDraw").addEventListener(
  "click",
  () => {

    if(track.length > 15){

      smoothTrack();

      show("menu");

    }

  }
);


$("useTrack").addEventListener(
  "click",
  () => {

    if(track.length > 15){

      smoothTrack();

      startRace();

    }

  }
);


$("pauseBtn").addEventListener(
  "click",
  () => {

    raceState.paused =
      !raceState.paused;

    $("pauseBtn").textContent =
      raceState.paused
      ? "▶"
      : "II";
  }
);


$("againBtn").addEventListener(
  "click",
  () => startRace()
);


$("resultMenuBtn").addEventListener(
  "click",
  () => show("menu")
);


/* ============================================================
   KEYBOARD
============================================================ */

window.addEventListener(
  "keydown",
  e => {

    if(e.key === "ArrowLeft")
      leftPressed=true;

    if(e.key === "ArrowRight")
      rightPressed=true;

    if(e.key === " ")
      brakePressed=true;
  }
);


window.addEventListener(
  "keyup",
  e => {

    if(e.key === "ArrowLeft")
      leftPressed=false;

    if(e.key === "ArrowRight")
      rightPressed=false;

    if(e.key === " ")
      brakePressed=false;
  }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
  "resize",
  () => {

    if(screens.draw.classList.contains("active"))
      resizeDrawCanvas();

    resizeRace();

  }
);


resizeRace();

</script>
